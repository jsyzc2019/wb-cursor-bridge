name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # verify = lint + typecheck + unit/e2e/admin/a2a/hardening + stress + fault
      #          + release build
      - run: npm run verify
      - name: End-to-end real-run empirical (real dist binary + fake-agent)
        run: npm run verify:e2e

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The .cmd shims (test/fake-agent.cmd, test/a2a-fake-agent.cmd) are checked
      # in: CreateProcess cannot exec a .mjs/.sh, so a generated shim was the
      # only reason a2a/stress/fault were skipped here. They now run as-is.
      - name: Main suite (unit + e2e + admin + a2a + hardening)
        shell: pwsh
        run: npm test
      - name: Stress and fault suites
        shell: pwsh
        run: |
          npm run test:stress
          npm run test:fault
      - name: Run PowerShell MCP config tests
        shell: pwsh
        run: pwsh -File test/mcp-config.test.ps1
      - name: Build release package
        shell: pwsh
        run: npm run build:release
