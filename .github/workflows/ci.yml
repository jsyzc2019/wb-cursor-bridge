name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the build only reads the repository. Without this the default
# token is write-capable, so any dependency that runs a postinstall script
# inherits the ability to push.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref: queued duplicates
# only burn minutes and report stale results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runtime dependencies only: devDependencies intentionally include
      # tooling that is not shipped, and a dev-only advisory must not block a
      # release while a production one must.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # verify = lint + typecheck + unit/e2e/admin/a2a/hardening/audit + stress
      #          + fault + release build
      - run: npm run verify
      # P4: the Agent Card is the trust anchor another agent reads first. This
      # zero-dependency gate builds both cards from the production builders and
      # fails on malformed fields, unknown bindings or over-claimed capabilities
      # (e.g. declaring pushNotifications without a delivery contract).
      - name: Agent Card static scan (P4)
        run: npm run scan:card
      - name: End-to-end real-run empirical (real dist binary + fake-agent)
        run: npm run verify:e2e
      # The evidence-pack regressions live in test/audit-*.test.mjs and are part
      # of `npm test`; this keeps the name visible in the job log so a future
      # reader can tell they were not skipped.
      - name: Audit regression suite (reproduced third-party PoCs)
        run: npm run test:audit
      # --------------------------------------------------------------------
      # Official A2A TCK — protocol compliance gate (P0 + multi-binding).
      # The TCK's main branch requires Python >= 3.15, unavailable here, so it
      # is pinned to the last Python-3.11-compatible commit. scripts/tck.mjs
      # boots the *real* built bridge behind a test-only Gherkin SUT adapter;
      # every protocol assertion hits production code, and any JUnit failure
      # or error fails the job. MANUAL requirements are reported, not scored.
      #
      # 0.6.0 gates BOTH declared bindings in one run: JSON-RPC + HTTP+JSON.
      # GRPC is deliberately NOT declared on the Agent Card and is NOT run
      # here (capability honesty: 65 grpc cases stay skipped, see
      # docs/a2a-v1-multibinding.md). pretest:tck rebuilds dist/ first so the
      # TCK never reads a stale card and reports a false green.
      # --------------------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned A2A TCK
        run: |
          git clone --quiet https://github.com/a2aproject/a2a-tck.git "$RUNNER_TEMP/a2a-tck"
          cd "$RUNNER_TEMP/a2a-tck"
          git checkout --quiet 70f6f73c30208e80c889141907e094899e6e9f05
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e .
      - name: Official A2A TCK (MUST / JSON-RPC + HTTP+JSON)
        env:
          A2A_TCK_DIR: ${{ runner.temp }}/a2a-tck
          TCK_TRANSPORT: jsonrpc,http_json
        run: npm run test:tck
      - name: Upload TCK reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-reports-linux
          path: reports/tck/
          if-no-files-found: warn
      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Syntax-gate the PowerShell entry points before running them. A parse
      # error in an installer is only discovered by the user whose install
      # fails; the parser finds it in seconds, on every push.
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/install.ps1',
            'scripts/uninstall.ps1',
            'test/mcp-config.test.ps1'
          )
          $failed = $false
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              Write-Host ("parse errors in {0}:" -f $f) -ForegroundColor Red
              $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "ok: $f"
            }
          }
          if ($failed) { exit 1 }
      # The .cmd shims (test/fake-agent.cmd, test/a2a-fake-agent.cmd) are checked
      # in: CreateProcess cannot exec a .mjs/.sh, so a generated shim was the
      # only reason a2a/stress/fault were skipped here. They now run as-is.
      - name: Main suite (unit + e2e + admin + a2a + hardening + audit)
        shell: pwsh
        # A hung child used to stall this step until the 30-minute job cap, with
        # no failing test named. 12 minutes is ~4x the observed worst case.
        timeout-minutes: 12
        run: npm test
      # Same P4 card-honesty gate on Windows; the cards are built by the same
      # TypeScript sources, so a platform-specific regression is still worth
      # catching where the release artefact is produced.
      - name: Agent Card static scan (P4)
        shell: pwsh
        run: npm run scan:card
      - name: Stress and fault suites
        shell: pwsh
        run: |
          npm run test:stress
          npm run test:fault
      - name: Run PowerShell MCP config tests
        shell: pwsh
        run: pwsh -File test/mcp-config.test.ps1
      - name: Build release package
        shell: pwsh
        run: npm run build:release
      # Rebuild and compare: a release that is not byte-reproducible cannot be
      # tied back to a commit, and that is the whole point of publishing a hash.
      - name: Verify the release archive is reproducible
        shell: pwsh
        run: |
          $file = Get-ChildItem release/*.zip | Select-Object -First 1
          $first = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          npm run build:release | Out-Null
          $second = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          if ($first -ne $second) {
            Write-Host "release is not reproducible: $first != $second" -ForegroundColor Red
            exit 1
          }
          Write-Host "release sha256 = $second"
      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error
